name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install ClickHouse for required integrations
        run: |
          mkdir -p "$RUNNER_TEMP/clickhouse-bin"
          curl -fL https://builds.clickhouse.com/master/amd64/clickhouse -o "$RUNNER_TEMP/clickhouse-bin/clickhouse"
          chmod +x "$RUNNER_TEMP/clickhouse-bin/clickhouse"
          echo "$RUNNER_TEMP/clickhouse-bin" >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun test
