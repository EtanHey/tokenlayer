name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    outputs: { median: '${{ steps.ratchet.outputs.median }}' }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tools
        with:
          path: ~/.cache/tokenlayer-ci
          key: tokenlayer-linux-x64-ch-26.10.3.7-executable-only-v3
      - name: Install official ClickHouse
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tokenlayer-ci
          cd ~/.cache/tokenlayer-ci
          pkg=clickhouse-common-static-26.10.3.7-amd64.tgz
          curl -fsSLO "https://packages.clickhouse.com/tgz/stable/$pkg"
          curl -fsSLO "https://packages.clickhouse.com/tgz/stable/$pkg.sha512"
          sha512sum -c "$pkg.sha512"
          tar -xzf "$pkg" --strip-components=3 clickhouse-common-static-26.10.3.7/usr/bin/clickhouse
          rm -- "$pkg" "$pkg.sha512"
      - name: Configure tools
        run: |
          echo "$HOME/.cache/tokenlayer-ci" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Full shipper property suite (300 trials)
        timeout-minutes: 10
        run: bun run test:property
      - name: Bootstrap judge content guard regression
        run: python3 scripts/test-ratchet-bootstrap.py
      - name: Ratchet (trusted base versus this PR)
        id: ratchet
        env:
          RATCHET_MEASURE_REF: origin/main
          RATCHET_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .local
          export TMPDIR="$PWD/.local"
          trusted=$(mktemp -d "$PWD/.local/trusted-XXXXXX")
          git archive "$RATCHET_BASE_REF" ratchet scripts/bench-redact.ts src/lib/local-clickhouse.ts tests/fixtures src/lib/clickhouse.ts src/lib/redact.ts | tar -x -C "$trusted"
          if test -f "$trusted/ratchet/guard.mjs"; then
            node "$trusted/ratchet/table.mjs" ratchet/rows.json
          else
            # Permit changed rows, but require the complete reviewed judge import closure.
            python3 scripts/check-ratchet-bootstrap.py "$RATCHET_BASE_REF"
            TRUSTED="$trusted" node --input-type=module <<'JS'
          const root = process.env.TRUSTED;
          const [{ runRows }, { evaluate }] = await Promise.all([import(`${root}/ratchet/run-rows.mjs`), import(`${root}/ratchet/table.mjs`)]);
          const { readFileSync } = await import('node:fs');
          const rows = JSON.parse(readFileSync(`${root}/ratchet/rows.json`)).rows.map(r => ({ ...r, command: r.command.replace('node ratchet/measure.mjs', `node ${root}/ratchet/measure.mjs`) }));
          process.env.REDACT_MODULE = `${process.cwd()}/src/lib/redact.ts`;
          const values = runRows(rows, process.cwd());
          if (rows.some(r => r.runner === 'ci' && !evaluate(r, values[r.id]))) process.exit(1);
          JS
            node ratchet/table.mjs ratchet/rows.json
          fi
  raise-floor:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Raise only after green main; refuse concurrent updates
        env:
          MEDIAN: ${{ needs.ci.outputs.median }}
        run: |
          node ratchet/raise.mjs "$MEDIAN"
          if ! git diff --quiet -- ratchet/rows.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ratchet/rows.json
            git commit -m 'ci: ratchet throughput floor to 80% of green main median'
            git push origin HEAD:main
          fi
