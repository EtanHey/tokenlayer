name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    outputs: { median: '${{ steps.ratchet.outputs.median }}' }
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tools
        with:
          path: ~/.cache/tokenlayer-ci
          key: tokenlayer-linux-x64-ch-26.10.3.7-tla-1.8.0-executable-only-v2
      - name: Install official ClickHouse and TLC
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tokenlayer-ci
          cd ~/.cache/tokenlayer-ci
          pkg=clickhouse-common-static-26.10.3.7-amd64.tgz
          curl -fsSLO "https://packages.clickhouse.com/tgz/stable/$pkg"
          curl -fsSLO "https://packages.clickhouse.com/tgz/stable/$pkg.sha512"
          sha512sum -c "$pkg.sha512"
          tar -xzf "$pkg" --strip-components=3 clickhouse-common-static-26.10.3.7/usr/bin/clickhouse
          rm -- "$pkg" "$pkg.sha512"
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -o tla2tools.jar
      - name: Verify TLC (including cache hits)
        run: echo 'fc6878c603f0fdc18b9fe3e5bf51860cb90ab5b1154e3c371660c036d6bdd63e  '"$HOME/.cache/tokenlayer-ci/tla2tools.jar" | sha256sum -c -
      - name: Configure tools
        run: |
          echo "$HOME/.cache/tokenlayer-ci" >> "$GITHUB_PATH"
          echo "TLA_JAR=$HOME/.cache/tokenlayer-ci/tla2tools.jar" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Independent admission safety mutation
        run: python3 scripts/check-admit-blind-mutation.py
      - name: Ratchet (trusted base versus this PR)
        id: ratchet
        env:
          RATCHET_MEASURE_REF: origin/main
          RATCHET_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .local
          export TMPDIR="$PWD/.local"
          trusted=$(mktemp -d "$PWD/.local/trusted-XXXXXX")
          git archive "$RATCHET_BASE_REF" ratchet scripts/bench-redact.ts tests/support/local-clickhouse.ts tests/fixtures src/lib/clickhouse.ts src/lib/redact.ts | tar -x -C "$trusted"
          if test -f "$trusted/ratchet/guard.mjs"; then
            node "$trusted/ratchet/table.mjs" ratchet/rows.json
          else
            # One reviewed adoption only; no fallback for later bases.
            test "$RATCHET_BASE_REF" = e1cd4224f3d6adc84f46c899cf043f5702104667
            TRUSTED="$trusted" node --input-type=module <<'JS'
          const root = process.env.TRUSTED;
          const [{ runRows }, { evaluate }] = await Promise.all([import(`${root}/ratchet/run-rows.mjs`), import(`${root}/ratchet/table.mjs`)]);
          const { readFileSync } = await import('node:fs');
          const rows = JSON.parse(readFileSync(`${root}/ratchet/rows.json`)).rows.map(r => ({ ...r, command: r.command.replace('node ratchet/measure.mjs', `node ${root}/ratchet/measure.mjs`) }));
          process.env.REDACT_MODULE = `${process.cwd()}/src/lib/redact.ts`;
          const values = runRows(rows, process.cwd());
          if (rows.some(r => r.runner === 'ci' && !evaluate(r, values[r.id]))) process.exit(1);
          JS
            node ratchet/table.mjs ratchet/rows.json
          fi
  raise-floor:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Raise only after green main; refuse concurrent updates
        env:
          MEDIAN: ${{ needs.ci.outputs.median }}
        run: |
          node ratchet/raise.mjs "$MEDIAN"
          if ! git diff --quiet -- ratchet/rows.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ratchet/rows.json
            git commit -m 'ci: ratchet throughput floor to 80% of green main median'
            git push origin HEAD:main
          fi

  canon-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare vendored canon 5 against golems default branch
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 -H 'Accept: application/vnd.github.raw+json' \
            https://api.github.com/repos/EtanHey/golems/contents/standards/fleet-canon.md > "$RUNNER_TEMP/fleet-canon.md"
          sed -n '/^5\. /,/^6\. /p' "$RUNNER_TEMP/fleet-canon.md" | sed '$d' | sed '${/^$/d;}' > "$RUNNER_TEMP/canon-5.md"
          diff -u tests/fixtures/admit/fleet-canon-5.md "$RUNNER_TEMP/canon-5.md"
